name: app_box
description: app_box desktop app — a chromed Stacked MVVM macOS app, forked from the stacked_kit showcase so the chrome, theming and seed data are copied, not written.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  stacked: ^3.5.0
  stacked_services: ^1.6.0
  # The kit — path deps to the sibling stacked_kit checkout (R2 exception 2:
  # stacked_kit names a real runtime dependency of this app and is retained).
  stacked_kit_core:
    path: ../../stacked_kit/core
  ui_library:
    path: ../../stacked_kit/ui_library
  stacked_kit_data:
    path: ../../stacked_kit/data
  # Device haptics — extracted from stacked_kit core (phase 2B).
  stacked_kit_haptics:
    path: ../../stacked_kit/haptics
  # M3E text field (focus shape-morph) — the Material-tier auth field
  # (Apple/desktop keep KitNativeTextField's native CNTextField capsule).
  text_field_m3e:
    path: ../../stacked_kit/ui_library/packages/text_field_m3e
  rxdart: ^0.28.0
  uuid: ^4.5.3
  # Web / responsive-stub structure (from `stacked create --template=web`).
  url_strategy: ^0.3.0
  responsive_builder: ^0.7.1
  flutter_animate: ^4.5.2
  # Media kit: voice-memo capture, playback with position streams, camera/library
  # photos — via the media kit's framework-free ports, wrapped by a thin app-side
  # adapter service.
  stacked_kit_media:
    path: ../../stacked_kit/media
  # Wake/setdown choreography — KitMotionScope/KitWake.
  stacked_kit_motion:
    path: ../../stacked_kit/motion
  # Full kit registration: all extracted kits resolve in this app's universe so
  # conflicts surface at pub get time.
  stacked_kit_analytics:
    path: ../../stacked_kit/analytics
  stacked_kit_auth:
    path: ../../stacked_kit/auth
  stacked_kit_bluetooth:
    path: ../../stacked_kit/bluetooth
  stacked_kit_compliance:
    path: ../../stacked_kit/compliance
  stacked_kit_deploy:
    path: ../../stacked_kit/deploy
  stacked_kit_documents:
    path: ../../stacked_kit/documents
  stacked_kit_forms:
    path: ../../stacked_kit/forms
  stacked_kit_maps:
    path: ../../stacked_kit/maps
  stacked_kit_notifications:
    path: ../../stacked_kit/notifications
  stacked_kit_payments:
    path: ../../stacked_kit/payments
  stacked_kit_permissions:
    path: ../../stacked_kit/permissions
  stacked_kit_security:
    path: ../../stacked_kit/security
  stacked_kit_state:
    path: ../../stacked_kit/state
  stacked_kit_support:
    path: ../../stacked_kit/support
  stacked_kit_wifi:
    path: ../../stacked_kit/wifi
  # Attachment binaries live in the app documents dir (rows carry paths).
  path_provider: ^2.1.5
  # app.dart registers Talker as a lazy singleton (KitAction/KitErrorService
  # resolve it from the locator).
  talker_flutter: ^5.1.17
  # Credential storage — macOS Keychain (8.6). Never hand-rolled crypto.
  flutter_secure_storage: ^10.3.1

# dependency_overrides: the vendored m3e forks (fab/split_button/toolbar/
# navigation_rail) live under ui_library/vendor and must resolve to those forks,
# not their pub.dev releases. win32-family conflict resolution carried over.
dependency_overrides:
  fab_m3e:
    path: ../../stacked_kit/ui_library/vendor/fab_m3e
  split_button_m3e:
    path: ../../stacked_kit/ui_library/vendor/split_button_m3e
  toolbar_m3e:
    path: ../../stacked_kit/ui_library/vendor/toolbar_m3e
  navigation_rail_m3e:
    path: ../../stacked_kit/ui_library/vendor/navigation_rail_m3e
  win32: ^6.0.1
  device_info_plus: ^13.0.0
  package_info_plus: ^10.0.0

dev_dependencies:
  build_runner: ^2.15.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.7.0
  stacked_generator: ^2.0.4
flutter:
  uses-material-design: true
  assets:
    - assets/seed/
    - assets/config/

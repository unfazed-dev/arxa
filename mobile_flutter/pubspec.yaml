name: arxa_studio_mobile
description: Arxa Studio mobile shell — native pairing/push/approvals + full-studio webview session. Generated by the arxa scaffolder (frozen design in design/structure.json); replaces the Tauri mobile scaffold at parity.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # stacked / stacked_services / rxdart / talker_flutter come via the kit
  # barrel (arxa_kit_ui_library re-exports them) — never declared here.
  arxa_kit_core:
    path: ../kit/core
  arxa_kit_ui_library:
    path: ../kit/ui_library
  arxa_kit_data:
    path: ../kit/data
  # Cairn backend — consumed for real in v1. Default mode localOnly
  # (ArxaKitCairnConfig.fromEnvironment: empty ARXA_CAIRN_MODE -> localOnly).
  arxa_kit_cairn:
    path: ../kit/cairn
  arxa_kit_haptics:
    path: ../kit/haptics
  # Push-token seam: notifications kit + ArxaKitCairnPushBridge; FCM pins
  # match showcase_app (config-less build stays green — no google-services.json).
  arxa_kit_notifications:
    path: ../kit/notifications
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  uuid: ^4.5.3
  m3e_collection: ^0.3.7
  lucide_flutter: ^1.25.0
  responsive_builder: ^0.7.1
  # QR pairing scanner: mobile_scanner — maintained (MLKit/AVFoundation),
  # null-safe, no platform-view camera hacks; qr_code_scanner is unmaintained.
  mobile_scanner: ^7.0.0
  # Studio session webview — 4.x verified for the desktop ADR (4.14.1).
  webview_flutter: ^4.14.1

# Mirrors kit/data's documented host-app requirement (pub overrides do not
# propagate): win32-family forced to the 6.x-compatible lines, and the
# vendored m3e forks (via m3e_collection) kept instead of pub.dev releases.
dependency_overrides:
  win32: ^6.0.1
  device_info_plus: ^13.0.0
  package_info_plus: ^10.0.0
  fab_m3e:
    path: ../kit/ui_library/vendor/fab_m3e
  split_button_m3e:
    path: ../kit/ui_library/vendor/split_button_m3e

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0
  stacked_generator: ^2.0.4
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

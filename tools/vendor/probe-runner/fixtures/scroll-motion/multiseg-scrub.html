<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>scroll-motion fixture: multi-segment scrub (out-and-back timeline)</title>
<style>
  /* Deterministic stand-in for a multi-segment ScrollTrigger timeline: the mover
     translates OUT then BACK across the scroll range (a common pin+timeline
     pattern). window.scrollY tracks progress (native scroll), so discovery finds
     the mover — but the motion is non-monotonic, so _anim_core.monotonic() rejects
     it and NO channel certifies. This isolates the multi-segment-timeline gap
     (distinct from the virtualized-scroll gap) on an otherwise web_anim-friendly
     page. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; background: #ffffff; font-family: Arial, sans-serif; }
  #spacer { height: 3000px; }
  #mover  { position: fixed; left: 100px; top: 200px; width: 200px; height: 200px;
            background: #16213e; will-change: transform; }
</style>
</head>
<body>
  <div id="mover"></div>
  <div id="spacer"></div>
<script>
  // Two LINEAR tweens (realistic multi-segment ScrollTrigger timeline):
  // tx rises 0 -> +400 over the first half of scroll, then falls +400 -> +100
  // over the second half. Net span +100 (non-zero) + non-monotonic, so the
  // single-easing path reports "non-monotonic / multi-phase" (Ashley's 41/60).
  // Each half is linear, so segmentation certifies both as one row each.
  // (A sine arc was rejected here: half a sine is not a standard easing; real
  // GSAP timelines chain eased/linear tweens, which segmentation fits.)
  var mover = document.getElementById('mover');
  function apply() {
    var maxS = document.documentElement.scrollHeight - innerHeight;
    var p = maxS > 0 ? Math.min(1, Math.max(0, window.scrollY / maxS)) : 0;
    var tx = p <= 0.5 ? 800 * p : 400 - 600 * (p - 0.5);   // 0 -> 400 -> 100
    mover.style.transform = 'translateX(' + tx + 'px)';
  }
  addEventListener('scroll', apply, { passive: true });
  apply();
</script>
</body>
</html>

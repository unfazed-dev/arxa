<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Arxa Studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="screen">
      <img class="logo" src="arxa-brand-logo.svg" alt="arxa studio" />

      <!-- state: not paired -->
      <section id="state-not-paired" class="state" hidden>
        <h1>Not paired</h1>
        <p>Scan the QR code from arxa studio on your Mac to pair this device.</p>
        <button id="scan-btn" type="button">Scan QR to pair</button>
        <button id="manual-link" class="link" type="button">enter code manually</button>
        <form id="manual-form" hidden>
          <input
            id="ticket-input"
            type="text"
            placeholder="arxa-pair:&hellip;"
            autocomplete="off"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
          />
          <button type="submit">Pair</button>
        </form>
        <p id="pairing-error" class="error" hidden></p>
      </section>

      <!-- state: connecting -->
      <section id="state-connecting" class="state" hidden>
        <h1>Connecting&hellip;</h1>
        <p>Reaching your Mac over the arxa link.</p>
      </section>
    </main>
    <script src="main.js"></script>
  </body>
</html>

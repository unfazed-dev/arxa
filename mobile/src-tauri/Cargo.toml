[package]
name = "arxa-mobile"
version = "0.1.0"
description = "Arxa Studio mobile shell (iOS + Android)"
edition = "2021"

[lib]
name = "arxa_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Phone <-> Mac transport (decision M1) — contract in docs/plans/mobile-pairing-transport.md.
iroh = "1.1"
iroh-tickets = "1"
data-encoding = "2.11"
libc = "0.2" # gethostname → self-reported device name in the AUTH frame
tokio = { version = "1", features = ["net", "io-util", "rt", "time", "macros"] }

# QR pairing (decision M2) — camera scanning exists only on the mobile targets.
# Push token minting (M7 seam) — APNs/FCM device token via the OS, mobile only;
# desktop's doorbell story is the WS session, not an OS rail.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.4"
tauri-plugin-mobile-push = "0.1.4"

{% extends "ui/common/base.html" %}
{% block title %}{{ t('auth.pageTitle') }}{% endblock %}

{% block content %}
{# Chromeless sign-in. Seeded: any input signs in. #}
<main class="centered-state">
  <section class="auth-card" aria-labelledby="auth-h">
    <span class="auth-brand">appbox studio</span>
    <h1 class="display" id="auth-h">{{ auth.headline }}</h1>
    <p class="muted">{{ auth.lede }}</p>

    <form class="auth-form" method="post" action="/auth/signin">
      <label class="auth-label" for="auth-email">{{ t('auth.email') }}</label>
      <input id="auth-email" type="email" name="email" placeholder="{{ account.email }}" autocomplete="email" autofocus>
      <button type="submit">{{ t('auth.continue') }}</button>
    </form>

    <p class="auth-or"><span>{{ t('auth.or') }}</span></p>

    {% for p in auth.providers %}
    <form method="post" action="/auth/signin">
      <button type="submit" class="ghost auth-provider" name="provider" value="{{ p.id }}">{{ p.label }}</button>
    </form>
    {% endfor %}
  </section>
</main>
{% endblock %}

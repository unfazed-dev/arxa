{# Portalo startup — keyframed CSS fill, then a meta refresh to sign-in.
   Zero JS, same pattern as the splash. #}
<meta http-equiv="refresh" content="3;url=/build/screens/portalo.access{{ pqs }}">
<main class="splash">
  <span class="splash-brand">{{ t('app.brand') }}</span>
  <span class="startup-bar" role="progressbar" aria-label="{{ t('startup.loading') }}"></span>
  <p class="splash-tagline">{{ t('startup.loading') }}</p>
</main>

{# Portalo splash — content mockup rendered by screen_stub_view.html.
   Auto-advances to the startup screen keeping vp/embed (pqs is set by the
   stub template). Meta refresh + CSS only, zero JS. #}
<meta http-equiv="refresh" content="2;url=/build/screens/portalo.startup{{ pqs }}">
<main class="splash">
  <span class="splash-brand">{{ t('app.brand') }}</span>
  <span class="splash-shimmer" role="progressbar"></span>
</main>

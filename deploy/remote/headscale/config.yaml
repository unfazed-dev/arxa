# headscale config — env vars are expanded by headscale itself.
# Full reference: https://headscale.net/stable/ref/configuration/

server_url: https://${HEADSCALE_DOMAIN}
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48

derp:
  server:
    enabled: false # rely on Tailscale's public DERP relays (ciphertext only)
  urls:
    - https://controlplane.tailscale.com/derpmap/default

disable_check_updates: true
ephemeral_node_inactivity_timeout: 30m

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite

log:
  format: text
  level: info

policy:
  mode: database

dns:
  magic_dns: true
  base_domain: mesh.appbox
  nameservers:
    global:
      - 1.1.1.1
      - 1.0.0.1

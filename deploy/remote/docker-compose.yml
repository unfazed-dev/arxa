# app-box self-host remote access (plan: consolidate-one-app-plus-daemon.md, decision 10).
# Headscale = coordination server (enrollment door, the ONLY public surface).
# Caddy terminates public Let's Encrypt TLS for headscale only — no app traffic
# is ever public; app traffic rides the WireGuard mesh (DERP relays see ciphertext only).

name: app-box-remote

services:
  headscale:
    image: headscale/headscale:0.29.2
    container_name: app-box-headscale
    restart: unless-stopped
    command: serve
    environment:
      # headscale expands env vars inside config.yaml
      HEADSCALE_DOMAIN: ${HEADSCALE_DOMAIN:?set HEADSCALE_DOMAIN in .env}
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - headscale-data:/var/lib/headscale
    expose:
      - "8080"

  caddy:
    image: caddy:2.10
    container_name: app-box-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      HEADSCALE_DOMAIN: ${HEADSCALE_DOMAIN:?set HEADSCALE_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - headscale

volumes:
  headscale-data:
  caddy-data:
  caddy-config:

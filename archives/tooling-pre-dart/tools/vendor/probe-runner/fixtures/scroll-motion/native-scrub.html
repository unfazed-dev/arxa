<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>scroll-motion fixture: native-scroll scrub (GSAP-ScrollTrigger class)</title>
<style>
  /* Deterministic stand-in for GSAP ScrollTrigger scrub on the NATIVE scroller:
     a scroll listener writes inline transforms as f(window.scrollY). No WAAPI,
     so document.getAnimations() === 0 — the exact condition the §C canary used
     to (incorrectly) infer "web_anim sees 0". window.scrollY DOES track progress,
     so web_anim's static-scrollY + transform-diff path SHOULD certify this.
     Motion is monotonic + single-segment so _anim_core can fit an easing. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; background: #ffffff; font-family: Arial, sans-serif; }
  #spacer { height: 3000px; }                 /* makes the page natively scrollable */
  #mover  { position: fixed; left: 100px; top: 200px; width: 200px; height: 200px;
            background: #1a1a2e; will-change: transform, opacity; }
</style>
</head>
<body>
  <div id="mover"></div>
  <div id="spacer"></div>
<script>
  // f(scrollY): translateX 0 -> -600px and opacity 1 -> 0.2, linear in progress.
  // Linear is the simplest certifiable easing; matches a GSAP scrub:1 binding.
  var mover = document.getElementById('mover');
  function apply() {
    var maxS = document.documentElement.scrollHeight - innerHeight;
    var p = maxS > 0 ? Math.min(1, Math.max(0, window.scrollY / maxS)) : 0;
    mover.style.transform = 'translateX(' + (-600 * p) + 'px)';
    mover.style.opacity = (1 - 0.8 * p).toFixed(4);
  }
  addEventListener('scroll', apply, { passive: true });
  apply();
</script>
</body>
</html>

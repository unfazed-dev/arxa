<!doctype html>
<!--
  artboards.html — static side-by-side comparison page (full-page example)
  The htmx-edition replacement for the upstream design-canvas (ADR-0002:
  the canvas's pan/zoom/reorder is JS-bound and intentionally dropped).
  Zero JavaScript: a labeled grid of .artboard figures plus a CSS :target
  focus mode.

  Usage
  -----
  This file is a complete page — copy it into an artifact (it also opens
  standalone, straight off disk). Swap each .artboard__canvas for a real
  screen (a frames/ device frame, a Named Fragment include, static markup).
  Screens render at natural size; the thumbnail scale is --ab-thumb.

  Focus mode: every artboard is wrapped in <a href="#ab-N">. Clicking makes
  the figure the :target — CSS turns it into a full-viewport dimmed overlay
  with the canvas at natural size (scrollable if oversized). Each overlay
  carries an explicit <a href="#">close</a>; the bare "#" clears :target.
  body:has(.artboard:target) locks background scroll where :has() exists.

  Server-driven version — the viewmodel supplies `artboards` and a Nunjucks
  loop stamps the figures (example markup in the comment at the bottom of
  <main>). Context shape: artboards: [{ label: "Home v1", partial:
  "ui/widgets/screens/home_v1.html" }, …].

  Honest limitation (be straight with users): this is a comparison page, not
  a canvas — no pan, no free zoom, no drag-reorder, no comment pins. The
  nearest upgrades within the boundary: browser zoom inside the focused
  overlay, and reordering = editing markup order (server-side). Anything
  richer is design-canvas territory, dropped per ADR-0002.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artboards — screen comparison</title>
  <style>
    :root {
      --ab-bg: #f4f4f6;
      --ab-fg: #17181c;
      --ab-dim: #6b7280;
      --ab-thumb: .4;             /* thumbnail zoom (canvas is 402×874) */
      --ab-overlay: rgb(8 10 14 / .85);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--ab-bg);
      color: var(--ab-fg);
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    .page-head { padding: 32px 32px 24px; }
    .page-head h1 { margin: 0 0 6px; font-size: 22px; }
    .page-head p { margin: 0; color: var(--ab-dim); font-size: 14px; }

    .artboards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
      gap: 28px;
      padding: 0 32px 48px;
    }
    .artboard { margin: 0; display: flex; flex-direction: column; gap: 8px; }
    .artboard__open {
      display: block;
      height: 380px;
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid rgb(0 0 0 / .08);
      background: #fff;
    }
    @supports not (zoom: 1) {
      /* no zoom: thumbs can't shrink — let the cell scroll instead */
      .artboard__open { overflow: auto; }
    }
    .artboard__canvas {
      display: block;
      width: 402px;
      height: 874px;
      zoom: var(--ab-thumb);
    }
    .artboard figcaption { font-size: 14px; font-weight: 600; }
    .artboard__close { display: none; }

    /* ---- zero-JS focus mode: the figure itself becomes the overlay ---- */
    .artboard:target {
      position: fixed;
      inset: 0;
      z-index: 50;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 14px;
      background: var(--ab-overlay);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .artboard:target .artboard__open {
      pointer-events: none;         /* already focused; don't re-navigate */
      height: auto;
      max-height: 82vh;
      overflow: auto;               /* oversized screens stay reachable */
      border: 0;
      border-radius: 18px;
      background: transparent;
    }
    .artboard:target .artboard__canvas { zoom: 1; }
    .artboard:target figcaption { color: #fff; font-size: 15px; }
    .artboard:target .artboard__close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 18px;
      right: 22px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgb(255 255 255 / .12);
      color: #fff;
      font-size: 20px;
      text-decoration: none;
    }
    @supports selector(:has(*)) {
      body:has(.artboard:target) { overflow: hidden; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .artboard:target { animation: ab-focus-in .18s ease-out; }
      @keyframes ab-focus-in { from { opacity: 0; } }
    }

    /* demo placeholder screens (replace with real screens) */
    .demo { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .demo__status { height: 22px; border-radius: 6px; background: rgb(0 0 0 / .12); width: 55%; }
    .demo__hero { height: 220px; border-radius: 16px; background: var(--demo-hue, #8b5cf6); }
    .demo__line { height: 16px; border-radius: 5px; background: rgb(0 0 0 / .1); }
    .demo__line--short { width: 62%; }
    .demo__card { height: 96px; border-radius: 12px; background: rgb(0 0 0 / .06); }
    .demo--2 { --demo-hue: #0d9488; }
    .demo--3 { --demo-hue: #ea580c; }
    .demo--4 { --demo-hue: #2563eb; }
  </style>
</head>
<body>
  <header class="page-head">
    <h1>Onboarding — variant comparison</h1>
    <p>Four candidate home screens, side by side. Click one to focus it; the
      overlay is pure <code>:target</code> CSS — no JavaScript anywhere on
      this page.</p>
  </header>

  <main class="artboards">
    <figure class="artboard" id="ab-1">
      <a class="artboard__open" href="#ab-1" aria-label="Focus Home v1">
        <span class="artboard__canvas demo">
          <span class="demo__status"></span>
          <span class="demo__hero"></span>
          <span class="demo__line"></span>
          <span class="demo__line demo__line--short"></span>
          <span class="demo__card"></span>
          <span class="demo__card"></span>
        </span>
      </a>
      <figcaption data-screen-label="Home v1">Home v1 — hero forward</figcaption>
      <a class="artboard__close" href="#" aria-label="Close focus view">&times;</a>
    </figure>

    <figure class="artboard" id="ab-2">
      <a class="artboard__open" href="#ab-2" aria-label="Focus Home v2">
        <span class="artboard__canvas demo demo--2">
          <span class="demo__status"></span>
          <span class="demo__hero"></span>
          <span class="demo__line"></span>
          <span class="demo__card"></span>
          <span class="demo__line demo__line--short"></span>
          <span class="demo__card"></span>
        </span>
      </a>
      <figcaption data-screen-label="Home v2">Home v2 — lagoon</figcaption>
      <a class="artboard__close" href="#" aria-label="Close focus view">&times;</a>
    </figure>

    <figure class="artboard" id="ab-3">
      <a class="artboard__open" href="#ab-3" aria-label="Focus Home v3">
        <span class="artboard__canvas demo demo--3">
          <span class="demo__status"></span>
          <span class="demo__hero"></span>
          <span class="demo__card"></span>
          <span class="demo__line"></span>
          <span class="demo__line demo__line--short"></span>
          <span class="demo__card"></span>
        </span>
      </a>
      <figcaption data-screen-label="Home v3">Home v3 — signal</figcaption>
      <a class="artboard__close" href="#" aria-label="Close focus view">&times;</a>
    </figure>

    <figure class="artboard" id="ab-4">
      <a class="artboard__open" href="#ab-4" aria-label="Focus Home v4">
        <span class="artboard__canvas demo demo--4">
          <span class="demo__status"></span>
          <span class="demo__hero"></span>
          <span class="demo__line"></span>
          <span class="demo__line"></span>
          <span class="demo__card"></span>
          <span class="demo__card"></span>
        </span>
      </a>
      <figcaption data-screen-label="Home v4">Home v4 — cobalt</figcaption>
      <a class="artboard__close" href="#" aria-label="Close focus view">&times;</a>
    </figure>

    <!--
      Server-driven example — replace the hardcoded figures above with this
      loop once the viewmodel supplies `artboards` (context shape in the
      header comment):

      {% for ab in artboards %}
      <figure class="artboard" id="ab-{{ loop.index }}">
        <a class="artboard__open" href="#ab-{{ loop.index }}" aria-label="Focus {{ ab.label }}">
          <span class="artboard__canvas">{% include ab.partial %}</span>
        </a>
        <figcaption data-screen-label="{{ ab.label }}">{{ ab.label }}</figcaption>
        <a class="artboard__close" href="#" aria-label="Close focus view">&times;</a>
      </figure>
      {% endfor %}
    -->
  </main>
</body>
</html>

name: appbox
description: "app-box — one Stacked app with full parity across web, macOS, iOS and Android. Consolidation slice 1: the honest bootstrap shell; the pipeline owns lib/ui/** once the scaffolder runs."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # Material/Widgets/Cupertino localizations delegates for MaterialApp.
  flutter_localizations:
    sdk: flutter
  # SDK-pinned via flutter_localizations — never pin.
  intl: any
  # Locale machinery kit (KitI18n, persisted locale override).
  stacked_kit_i18n:
    path: ../../stacked_kit/i18n
  stacked: ^3.4.0
  stacked_services: ^1.1.0
  url_strategy: ^0.2.0
  responsive_builder: ^0.7.0
  flutter_animate: ^4.1.1+1
  # security/ (mined from companion): SHA-256 for the pairing fingerprint pin.
  crypto: ^3.0.6
  # security/widgets/prototype_view.dart — the phone-path prototype surface.
  # Not web-compatible; it lives in the interim widgets home, not lib/ui/**.
  webview_flutter: ^4.10.0

dev_dependencies:
  build_runner: ^2.4.5
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mockito: ^5.4.1
  stacked_generator: ^1.3.3
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    # security/config/companion_config.dart loads this bundled config (R3: no
    # project-varying literals in code).
    - assets/config/


[package]
name = "arxa-desktop"
version = "0.1.0"
description = "Arxa desktop shell — Tauri wrapper around the locally served arxa studio web UI"
edition = "2021"
publish = false

[lib]
name = "arxa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Mobile pairing: iroh p2p endpoint + local QR rendering (no network service).
iroh = "1.1"
iroh-tickets = "1"
qrcode = "0.14"
data-encoding = "2"
tokio = { version = "1", features = ["net", "io-util", "rt", "macros", "time"] }

# Auto-update (desktop only — the updater plugin does not support mobile).
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

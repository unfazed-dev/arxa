[package]
name = "arxa-desktop"
version = "0.1.0"
description = "Arxa desktop shell — Tauri wrapper around the locally served arxa studio web UI"
edition = "2021"
publish = false

[lib]
name = "arxa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Mobile pairing: iroh p2p endpoint + local QR rendering (no network service).
iroh = "1.1"
iroh-tickets = "1"
qrcode = "0.14"
data-encoding = "2"
tokio = { version = "1", features = ["net", "io-util", "rt", "macros", "time"] }
tauri-plugin-dialog = "2"

# Headless pairing conformance test (tests/pairing_conformance.rs): drives the
# real mobile-side client against the real desktop-side host on one machine.
[dev-dependencies]
rqrr = "0.8"
arxa-mobile = { path = "../../mobile/src-tauri" }
tokio = { version = "1", features = ["rt-multi-thread"] }

# Auto-update (desktop only — the updater plugin does not support mobile),
# and the WKWebView boot gate (D3 tiered gate, update-strategy amendment
# 2026-09-05): WebdriverIO's embedded WebDriver server + wdio bridge plugin,
# compiled ONLY behind `--features wdio` (desktop/e2e drives it; the release
# pipeline never sets the feature, so no WebDriver surface ships in a signed
# build). macOS note: there is NO standalone WKWebView WebDriver — the
# embedded server inside the app is the only macOS route (@wdio/tauri-service).
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
tauri-plugin-wdio = { version = "1", optional = true }

[features]
wdio = ["dep:tauri-plugin-wdio-webdriver", "dep:tauri-plugin-wdio"]


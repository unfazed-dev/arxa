[package]
name = "arxa-desktop"
version = "0.1.0"
description = "Arxa desktop shell — Tauri wrapper around the locally served arxa studio web UI"
edition = "2021"
publish = false

[lib]
name = "arxa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

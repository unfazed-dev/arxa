# Template: ~/.dsh/profiles/headless/cordis.patch.yml
# Wires the arxa external gate into every headless tool call.
# Install (the harness config is operator-owned, so copy it yourself):
#   cp harness/headless-profile/cordis.patch.yml ~/.dsh/profiles/headless/
# The plugin loads by absolute path because the profile declares no npm
# dependency on it (template: harness/README.md:102-109).
- insert:
  - id: arxa-gate
    name: /Volumes/developer_ssd/Developer/totem_labs/arxa/harness/dsh-external-gate/index.mjs
    config:
      command: /Volumes/developer_ssd/Developer/totem_labs/arxa/harness/verdict.sh
      # dsh-native tool names (dsh-tool-fs registers write/edit, not Write/Edit).
      tools: [write, edit, str_replace_editor, bash]
      timeoutMs: 5000

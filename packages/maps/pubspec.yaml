name: appbox_kit_maps
description: Maps port for stacked_kit apps — a plugin-neutral KitMapView that
  resolves to a native map provider per platform (Google Maps on Android/web,
  Apple Maps on iOS), behind Kit-owned value types so no app code ever imports
  a map SDK directly.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.0.3 <4.0.0'

# NATIVE-FIRST / STANDALONE: this package intentionally depends on neither
# stacked_kit (core), stacked, nor stacked_services. It is a pure port with
# two real, wired providers — google_maps_flutter and apple_maps_flutter —
# chosen because they are each platform's first-party map SDK with no API
# key friction beyond platform config. OpenStreetMap (flutter_map) and
# Mapbox (mapbox_maps_flutter) are file stubs — they name their target
# package+version in a TODO but are NOT added as dependencies here, so a
# host that never opts into them pulls neither dependency.
dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.17.1
  apple_maps_flutter: ^1.4.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

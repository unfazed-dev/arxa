name: appbox_kit_support
description: In-app support port for stacked_kit apps — screenshot+annotation feedback flow (feedback package) bundled with an injected Talker log export, routed to a swappable submission sink (local-file export by default). Standalone; no stacked_kit core dependency.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.0.3 <4.0.0'

# NATIVE-FIRST / STANDALONE: no dependency on stacked_kit (core), stacked, or
# stacked_services. The Talker instance is INJECTED (apps already register it
# as a lazy singleton) — this package never constructs one.
#
# Submission sinks are a port: the default LocalFileSubmissionSink writes to the
# app-documents dir (path_provider, native). The email + github-issue sinks are
# file stubs (no smtp / http client wired) that name their intent in a TODO.
dependencies:
  flutter:
    sdk: flutter
  # Screenshot + annotation feedback flow (BetterFeedback wrapper at app root).
  feedback: ^3.2.0
  # Diagnostics: read the app's already-registered Talker's log history. Talker
  # is INJECTED, never created here. talker_flutter re-exports the Talker type.
  talker_flutter: ^5.1.17
  # Default submission sink writes the bundle to the app-documents directory.
  path_provider: ^2.1.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

name: appbox_kit_media
description: >-
  Media kit for stacked_kit apps — "pixels and sound, in and out": camera and
  photo-library capture, audio recording, and audio + video playback exposed
  as framework-free ports over native-backed plugins. Music and video playback
  are absorbed here; there are no separate music/video kits.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Native-first: thin wrappers over OS-backed plugins (AVFoundation / CameraX
  # / ExoPlayer). Constraints match the versions already resolved in the
  # monorepo tree so a host app's lockfile does not have to move.
  record: ^7.1.1
  just_audio: ^0.10.6
  image_picker: ^1.2.3
  # Video playback backing the VideoPlayerService port (AVPlayer / ExoPlayer).
  # Latest verified on pub.dev 2026-07-30: 2.13.0.
  video_player: ^2.13.0
  # Temp-file fallback for recordings when the caller passes no explicit path.
  path_provider: ^2.1.5

# Deliberately NOT depended on: stacked / stacked_services / stacked_kit. This
# kit is pure ports + backing plugins — apps depend on it, never the reverse.

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

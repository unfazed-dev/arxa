name: appbox_kit_haptics
description: Device haptic feedback for Stacked apps — a reactive KitHapticService (RxDart streams, persisted enable state, device-capability checking) over the haptic_feedback package, plus a withHapticFeedback() widget extension. Standalone capability kit; no dependency on stacked_kit core.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Core device-haptics engine (iOS Core Haptics + emulated Android patterns).
  haptic_feedback: ^0.6.4+3
  # KitHapticService mixes in ListenableServiceMixin (defined in `stacked`).
  stacked: ^3.5.0
  # StackedLocator.instance — the shared singleton the extension resolves
  # KitHapticService through (mirrors stacked_kit core's kit_locator).
  stacked_shared: ^1.4.2
  # Reactive state streams for enable / capability / last-event.
  rxdart: ^0.28.0
  # Persists the haptic-enabled preference across launches.
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

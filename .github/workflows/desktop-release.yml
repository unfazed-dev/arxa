# Desktop release CI — builds the Arxa Studio Tauri shell on studio-v* tags and
# publishes auto-update artifacts to the public unfazed-dev/arxa-releases repo:
#   - bundle assets (.app.tar.gz + .sig, .dmg) on a GitHub Release
#   - desktop/{channel}/{target}/{arch}/latest.json committed to main
#     (served via raw.githubusercontent.com — the updater endpoint in
#     desktop/src-tauri/tauri.conf.json)
#
# Required secrets are documented in desktop/README.md ("Release CI").
# Notarization is optional: absent notary secrets yield a signed-but-unnotarized
# build instead of a failure. macOS aarch64 only for now — a Windows/x64 lane
# would slot in as a build matrix entry (target triple + runner + bundle paths).
name: desktop-release

on:
  push:
    tags: ["studio-v*"]

env:
  TARGET_TRIPLE: aarch64-apple-darwin
  TAURI_TARGET: darwin
  TAURI_ARCH: aarch64
  CHANNEL: stable
  RELEASES_REPO: unfazed-dev/arxa-releases

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout arxa
        uses: actions/checkout@v4
        with:
          path: arxa

      - name: Checkout arxa-studio (engine, private)
        uses: actions/checkout@v4
        with:
          repository: unfazed-dev/arxa-studio
          token: ${{ secrets.ARXA_STUDIO_CHECKOUT_TOKEN }}
          path: arxa-studio

      - name: Guard required secrets
        env:
          TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RELEASES_TOKEN: ${{ secrets.GH_RELEASES_TOKEN }}
        run: |
          [ -n "$TAURI_KEY" ] || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set — updater artifacts cannot be signed"; exit 1; }
          [ -n "$RELEASES_TOKEN" ] || { echo "::error::GH_RELEASES_TOKEN is not set — cannot publish to $RELEASES_REPO"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun (pack-sidecar uses `bun build --compile`)
        uses: oven-sh/setup-bun@v2

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            arxa/desktop/src-tauri/target
          key: desktop-release-cargo-${{ runner.os }}-${{ hashFiles('arxa/desktop/src-tauri/Cargo.lock') }}

      - name: Build CLI sidecar (dart compile exe)
        working-directory: arxa/arxa
        run: |
          dart pub get
          mkdir -p ../desktop/src-tauri/binaries
          dart compile exe bin/arxa.dart -o "../desktop/src-tauri/binaries/arxa-${TARGET_TRIPLE}"

      - name: Build engine sidecar (pack-sidecar.mjs)
        working-directory: arxa-studio
        run: |
          npm install --no-audit --no-fund
          node scripts/pack-sidecar.mjs --out "$GITHUB_WORKSPACE/arxa/desktop/src-tauri/binaries/arxa-studio-${TARGET_TRIPLE}"

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12" ]; then
            echo "::warning::APPLE_CERTIFICATE_P12 not set — skipping cert import (ad-hoc signing)"
            exit 0
          fi
          KEYCHAIN_PW="$(uuidgen)"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build desktop shell (tauri build, updater artifacts)
        working-directory: arxa/desktop/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Tauri signs when APPLE_SIGNING_IDENTITY is set and notarizes when the
          # APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID trio is set (xcrun notarytool
          # under the hood) — unset empties so absent secrets mean "skip", giving
          # a signed-but-unnotarized (or ad-hoc-signed) build rather than a failure.
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            unset APPLE_SIGNING_IDENTITY
            echo "::warning::APPLE_SIGNING_IDENTITY not set — building with ad-hoc signature"
          fi
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            echo "::warning::notary secrets absent — skipping notarization (signed-but-unnotarized build)"
          fi
          npx --yes @tauri-apps/cli@^2 build --target "$TARGET_TRIPLE"

      - name: Stage assets and generate latest.json
        run: |
          VERSION="${GITHUB_REF_NAME#studio-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          BUNDLE_DIR="arxa/desktop/src-tauri/target/${TARGET_TRIPLE}/release/bundle"
          ASSET="Arxa-Studio-${VERSION}-${TARGET_TRIPLE}.app.tar.gz"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          mkdir -p staging
          cp "$BUNDLE_DIR/macos/Arxa Studio.app.tar.gz" "staging/$ASSET"
          cp "$BUNDLE_DIR/macos/Arxa Studio.app.tar.gz.sig" "staging/$ASSET.sig"
          DMG="$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -name '*.dmg' 2>/dev/null | head -1)"
          if [ -n "$DMG" ]; then cp "$DMG" "staging/Arxa-Studio-${VERSION}-${TARGET_TRIPLE}.dmg"; fi
          URL="https://github.com/${RELEASES_REPO}/releases/download/studio-v${VERSION}/${ASSET}"
          node arxa/desktop/scripts/make-update-manifest.mjs \
            --bundle "staging/$ASSET" --sig "staging/$ASSET.sig" \
            --version "$VERSION" --channel "$CHANNEL" \
            --target "$TAURI_TARGET" --arch "$TAURI_ARCH" \
            --url "$URL" --out staging/latest.json
          node arxa/desktop/scripts/make-update-manifest.mjs --check staging/latest.json

      - name: Publish GitHub Release on arxa-releases
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASES_TOKEN }}
        run: |
          ASSETS=(staging/"$ASSET" staging/"$ASSET".sig)
          DMG="$(find staging -maxdepth 1 -name '*.dmg' | head -1)"
          if [ -n "$DMG" ]; then ASSETS+=("$DMG"); fi
          gh release create "studio-v${VERSION}" \
            --repo "$RELEASES_REPO" \
            --title "Arxa Studio ${VERSION}" \
            --notes "Arxa Studio ${VERSION} (${CHANNEL}, ${TARGET_TRIPLE})" \
            "${ASSETS[@]}"

      - name: Push latest.json to arxa-releases main
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASES_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${RELEASES_REPO}.git" releases
          MANIFEST_DIR="releases/desktop/${CHANNEL}/${TAURI_TARGET}/${TAURI_ARCH}"
          mkdir -p "$MANIFEST_DIR"
          cp staging/latest.json "$MANIFEST_DIR/latest.json"
          cd releases
          git config user.name "arxa-release-bot"
          git config user.email "noreply@arxadigital.solutions"
          git add "desktop/${CHANNEL}/${TAURI_TARGET}/${TAURI_ARCH}/latest.json"
          git commit -m "chore: publish ${CHANNEL} ${TAURI_TARGET}/${TAURI_ARCH} manifest for ${VERSION}"
          git push origin HEAD:main

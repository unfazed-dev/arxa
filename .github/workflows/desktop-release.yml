# Desktop release CI — builds the Arxa Studio Tauri shell on studio-v* (stable)
# and studio-beta-v* (beta) tags (D21 channel ladder) and publishes auto-update
# artifacts to the public unfazed-dev/arxa-releases repo:
#   - bundle assets (.app.tar.gz + .sig, .dmg) on a GitHub Release
#   - desktop/{channel}/{target}/{arch}/latest.json committed to main
#     (served via raw.githubusercontent.com — the updater endpoint in
#     desktop/src-tauri/tauri.conf.json)
#
# Required secrets are documented in desktop/README.md ("Release CI") and the
# runbook is docs/ci/release-ops.md.
# Notarization is optional: absent notary secrets yield a signed-but-unnotarized
# build instead of a failure. Two lanes: macOS aarch64 (self-hosted) and Linux
# x86_64 (GitHub-hosted ubuntu-22.04 — the AppImage + .deb; see the
# `release-linux` job). A Windows/x64 lane would slot in the same way.
name: desktop-release

on:
  push:
    tags: ["studio-v*", "studio-beta-v*"]

env:
  TARGET_TRIPLE: aarch64-apple-darwin
  TAURI_TARGET: darwin
  TAURI_ARCH: aarch64
  CHANNEL: stable # default only — the "Derive channel" step writes the real one per tag
  RELEASES_REPO: unfazed-dev/arxa-releases

jobs:
  release:
    runs-on: [self-hosted, macOS, ARM64, arxa]
    # D10 (key custody): the TAURI_SIGNING_PRIVATE_KEY secret lives in this
    # GitHub environment (secrets visible only to jobs that declare it), not
    # as a bare repo secret readable by every run. Deployment tag policies
    # (studio-v* / studio-beta-v*) are intended but blocked on the private
    # repo's Free plan — see docs/ci/release-ops.md.
    # Repo-level GH_RELEASES_TOKEN and ARXA_STUDIO_CHECKOUT_TOKEN stay
    # repo-level — environment jobs can still read repo secrets.
    environment: release
    steps:
      - name: Checkout arxa
        uses: actions/checkout@v4
        with:
          path: arxa

      - name: Checkout arxa-studio (engine, private)
        uses: actions/checkout@v4
        with:
          repository: unfazed-dev/arxa-studio
          token: ${{ secrets.ARXA_STUDIO_CHECKOUT_TOKEN }}
          path: arxa-studio

      - name: Derive channel and version from tag
        run: |
          # D21: studio-v* -> stable, studio-beta-v* -> beta. Written to
          # GITHUB_ENV so every later step's $CHANNEL/$VERSION follows the lane.
          case "${GITHUB_REF_NAME}" in
            studio-beta-v*)
              echo "CHANNEL=beta" >> "$GITHUB_ENV"
              echo "VERSION=${GITHUB_REF_NAME#studio-beta-v}" >> "$GITHUB_ENV"
              ;;
            studio-v*)
              echo "CHANNEL=stable" >> "$GITHUB_ENV"
              echo "VERSION=${GITHUB_REF_NAME#studio-v}" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::unexpected tag ${GITHUB_REF_NAME} (want studio-v* or studio-beta-v*)"
              exit 1
              ;;
          esac

      - name: Guard required secrets
        env:
          TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RELEASES_TOKEN: ${{ secrets.GH_RELEASES_TOKEN }}
        run: |
          [ -n "$TAURI_KEY" ] || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set — updater artifacts cannot be signed"; exit 1; }
          [ -n "$RELEASES_TOKEN" ] || { echo "::error::GH_RELEASES_TOKEN is not set — cannot publish to $RELEASES_REPO"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun (pack-sidecar uses `bun build --compile`)
        uses: oven-sh/setup-bun@v2

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            arxa/desktop/src-tauri/target
          key: desktop-release-cargo-${{ runner.os }}-${{ hashFiles('arxa/desktop/src-tauri/Cargo.lock') }}

      - name: Build CLI sidecar (dart compile exe)
        working-directory: arxa/arxa
        run: |
          dart pub get
          mkdir -p ../desktop/src-tauri/binaries
          dart compile exe bin/arxa.dart -o "../desktop/src-tauri/binaries/arxa-${TARGET_TRIPLE}"

      - name: Build the artifact viewer's monaco bundle
        # A separate npm root whose dist/ is gitignored, so a fresh checkout has
        # none — and pack-sidecar REFUSES to pack a viewer that cannot open a
        # file. Must run before the sidecar build, not after.
        working-directory: arxa-studio/plugins/artifact-viewer/lib/monaco-build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build engine sidecar (pack-sidecar.mjs)
        working-directory: arxa-studio
        run: |
          npm install --no-audit --no-fund
          node scripts/pack-sidecar.mjs --out "$GITHUB_WORKSPACE/arxa/desktop/src-tauri/binaries/arxa-studio-${TARGET_TRIPLE}"

      - name: Packed engine boot smoke (the artifact that ships)
        # The same gate arxa-studio runs on its checkout, pointed at the PACKED
        # binary: extraction, the pinned node, the payload's plugin tree and the
        # profile rows all have to work for this to answer 200 HTML. A release
        # that cannot boot its own engine stops here instead of shipping.
        working-directory: arxa-studio
        env:
          ARXA_SMOKE_LAUNCHER: ${{ github.workspace }}/arxa/desktop/src-tauri/binaries/arxa-studio-${{ env.TARGET_TRIPLE }}
          # A lane of our own: the self-hosted runner often has the operator's
          # real engine on the smoke default (7919).
          ARXA_SMOKE_PORT: "7931"
        run: npm run smoke

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12" ]; then
            echo "::warning::APPLE_CERTIFICATE_P12 not set — skipping cert import (ad-hoc signing)"
            exit 0
          fi
          KEYCHAIN_PW="$(uuidgen)"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build desktop shell (tauri build, updater artifacts)
        working-directory: arxa/desktop/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Tauri signs when APPLE_SIGNING_IDENTITY is set and notarizes when the
          # APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID trio is set (xcrun notarytool
          # under the hood) — unset empties so absent secrets mean "skip", giving
          # a signed-but-unnotarized (or ad-hoc-signed) build rather than a failure.
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            unset APPLE_SIGNING_IDENTITY
            echo "::warning::APPLE_SIGNING_IDENTITY not set — building with ad-hoc signature"
          fi
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            echo "::warning::notary secrets absent — skipping notarization (signed-but-unnotarized build)"
          fi
          npx --yes @tauri-apps/cli@^2 build --target "$TARGET_TRIPLE"

      - name: Stage assets and generate latest.json
        run: |
          # VERSION/CHANNEL come from the "Derive channel and version" step.
          BUNDLE_DIR="arxa/desktop/src-tauri/target/${TARGET_TRIPLE}/release/bundle"
          ASSET="Arxa-Studio-${VERSION}-${TARGET_TRIPLE}.app.tar.gz"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          mkdir -p staging
          cp "$BUNDLE_DIR/macos/Arxa Studio.app.tar.gz" "staging/$ASSET"
          cp "$BUNDLE_DIR/macos/Arxa Studio.app.tar.gz.sig" "staging/$ASSET.sig"
          DMG="$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -name '*.dmg' 2>/dev/null | head -1)"
          if [ -n "$DMG" ]; then cp "$DMG" "staging/Arxa-Studio-${VERSION}-${TARGET_TRIPLE}.dmg"; fi
          # Release tag = the triggering tag itself (studio-v1.2.3 /
          # studio-beta-v1.2.3-beta.1) — reconstructing "studio-v${VERSION}"
          # would mint a mismatched tag inside arxa-releases on beta lanes.
          URL="https://github.com/${RELEASES_REPO}/releases/download/${GITHUB_REF_NAME}/${ASSET}"
          node arxa/desktop/scripts/make-update-manifest.mjs \
            --bundle "staging/$ASSET" --sig "staging/$ASSET.sig" \
            --version "$VERSION" --channel "$CHANNEL" \
            --target "$TAURI_TARGET" --arch "$TAURI_ARCH" \
            --url "$URL" --out staging/latest.json
          node arxa/desktop/scripts/make-update-manifest.mjs --check staging/latest.json

      - name: Publish GitHub Release on arxa-releases
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASES_TOKEN }}
        run: |
          ASSETS=(staging/"$ASSET" staging/"$ASSET".sig)
          DMG="$(find staging -maxdepth 1 -name '*.dmg' | head -1)"
          if [ -n "$DMG" ]; then ASSETS+=("$DMG"); fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$RELEASES_REPO" \
            --title "Arxa Studio ${VERSION}" \
            --notes "Arxa Studio ${VERSION} (${CHANNEL}, ${TARGET_TRIPLE})" \
            "${ASSETS[@]}"

      - name: Push latest.json to arxa-releases main
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASES_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${RELEASES_REPO}.git" releases
          MANIFEST_DIR="releases/desktop/${CHANNEL}/${TAURI_TARGET}/${TAURI_ARCH}"
          mkdir -p "$MANIFEST_DIR"
          cp staging/latest.json "$MANIFEST_DIR/latest.json"
          cd releases
          git config user.name "arxa-release-bot"
          git config user.email "noreply@arxadigital.solutions"
          git add "desktop/${CHANNEL}/${TAURI_TARGET}/${TAURI_ARCH}/latest.json"
          git commit -m "chore: publish ${CHANNEL} ${TAURI_TARGET}/${TAURI_ARCH} manifest for ${VERSION}"
          git push origin HEAD:main

      # D6 (R2 primary + GitHub raw fallback): optional mirror of the manifest
      # to the R2 feed bucket. Once the bucket is live, the R2 URL becomes the
      # FIRST entry in tauri.conf.json plugins.updater.endpoints with the
      # raw.githubusercontent.com URL kept second as fallback — do NOT flip
      # that until the bucket exists. Setup + flip checklist:
      # docs/ci/release-ops.md#r2-feed.
      - name: Publish latest.json to R2 feed (optional)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN not set — skipping R2 publish (feed stays GitHub-raw only)"
            exit 0
          fi
          node arxa/desktop/scripts/publish-feed.mjs \
            --manifest staging/latest.json \
            --channel "$CHANNEL" \
            --target "$TAURI_TARGET" --arch "$TAURI_ARCH" \
            --bucket "${{ vars.R2_FEED_BUCKET || 'arxa-releases' }}"

  # Linux: AppImage (the updater artifact) + .deb, built on ubuntu-22.04 so the
  # glibc floor is 2.35 (Tauri's own guidance: the build host's glibc is the
  # floor for every user). The engine ships at /usr/libexec via
  # desktop/src-tauri/tauri.linux.conf.json, NOT as an externalBin — linuxdeploy
  # patchelfs everything under usr/bin and usr/lib and the bun-compiled engine
  # does not survive that (arxa-studio docs/linux-support.md). Runs after the
  # macOS job because that job CREATES the GitHub Release; this one uploads to
  # it. arm64 Linux is built locally for now (arxa-studio
  # scripts/linux/run-container.sh, DISTRO=ubuntu) — add an ubuntu-22.04-arm
  # matrix entry once the repo's plan has that runner.
  release-linux:
    needs: release
    runs-on: ubuntu-22.04
    environment: release
    env:
      TARGET_TRIPLE: x86_64-unknown-linux-gnu
      TAURI_TARGET: linux
      TAURI_ARCH: x86_64
    steps:
      - name: Checkout arxa
        uses: actions/checkout@v4
        with:
          path: arxa

      - name: Checkout arxa-studio (engine, private)
        uses: actions/checkout@v4
        with:
          repository: unfazed-dev/arxa-studio
          token: ${{ secrets.ARXA_STUDIO_CHECKOUT_TOKEN }}
          path: arxa-studio

      - name: Derive channel and version from tag
        run: |
          case "${GITHUB_REF_NAME}" in
            studio-beta-v*) echo "CHANNEL=beta" >> "$GITHUB_ENV"; echo "VERSION=${GITHUB_REF_NAME#studio-beta-v}" >> "$GITHUB_ENV" ;;
            studio-v*)      echo "CHANNEL=stable" >> "$GITHUB_ENV"; echo "VERSION=${GITHUB_REF_NAME#studio-v}" >> "$GITHUB_ENV" ;;
            *) echo "::error::unexpected tag ${GITHUB_REF_NAME}"; exit 1 ;;
          esac

      - name: Linux build deps (Tauri's ubuntu-22.04 list + what linuxdeploy-plugin-gtk shells out to)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file patchelf libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev \
            libgtk-3-bin libgdk-pixbuf2.0-bin libglib2.0-bin desktop-file-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun (pack-sidecar uses `bun build --compile`)
        uses: oven-sh/setup-bun@v2

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            arxa/desktop/src-tauri/target
          key: desktop-release-cargo-${{ runner.os }}-${{ hashFiles('arxa/desktop/src-tauri/Cargo.lock') }}

      - name: Build CLI sidecar (dart compile exe)
        working-directory: arxa/arxa
        run: |
          dart pub get
          mkdir -p ../desktop/src-tauri/binaries
          dart compile exe bin/arxa.dart -o "../desktop/src-tauri/binaries/arxa-${TARGET_TRIPLE}"

      - name: Build the artifact viewer's monaco bundle
        working-directory: arxa-studio/plugins/artifact-viewer/lib/monaco-build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build engine sidecar (pack-sidecar.mjs — also writes binaries/libexec/arxa-studio on Linux)
        working-directory: arxa-studio
        run: |
          npm install --no-audit --no-fund
          node scripts/pack-sidecar.mjs --out "$GITHUB_WORKSPACE/arxa/desktop/src-tauri/binaries/arxa-studio-${TARGET_TRIPLE}"
          test -x "$GITHUB_WORKSPACE/arxa/desktop/src-tauri/binaries/libexec/arxa-studio"

      - name: Packed engine boot smoke (the artifact that ships)
        working-directory: arxa-studio
        env:
          ARXA_SMOKE_LAUNCHER: ${{ github.workspace }}/arxa/desktop/src-tauri/binaries/arxa-studio-${{ env.TARGET_TRIPLE }}
        run: npm run smoke

      - name: Build desktop shell (tauri build, appimage + deb, updater artifacts)
        working-directory: arxa/desktop/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx --yes @tauri-apps/cli@^2 build --bundles appimage deb

      - name: Assert the AppDir layout (the bug that broke the first AppImage)
        run: |
          APPDIR="arxa/desktop/src-tauri/target/release/bundle/appimage/Arxa Studio.AppDir"
          PACKED="arxa/desktop/src-tauri/binaries/arxa-studio-${TARGET_TRIPLE}"
          [ ! -e "$APPDIR/usr/bin/arxa-studio" ] || { echo "::error::engine landed in usr/bin — linuxdeploy patched it"; exit 1; }
          cmp "$PACKED" "$APPDIR/usr/libexec/arxa-studio/arxa-studio" || { echo "::error::engine in the AppDir is not byte-identical"; exit 1; }
          # and the engine that is INSIDE the image boots
          IMG="$(find arxa/desktop/src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -1)"
          mkdir -p "$RUNNER_TEMP/x" && (cd "$RUNNER_TEMP/x" && "$GITHUB_WORKSPACE/$IMG" --appimage-extract > /dev/null)
          (cd arxa-studio && ARXA_SMOKE_LAUNCHER="$RUNNER_TEMP/x/squashfs-root/usr/libexec/arxa-studio/arxa-studio" npm run smoke)

      - name: Stage assets and generate latest.json
        run: |
          BUNDLE_DIR="arxa/desktop/src-tauri/target/release/bundle"
          ASSET="Arxa-Studio-${VERSION}-${TARGET_TRIPLE}.AppImage"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          mkdir -p staging
          IMG="$(find "$BUNDLE_DIR/appimage" -maxdepth 1 -name '*.AppImage' | head -1)"
          cp "$IMG" "staging/$ASSET"
          cp "$IMG.sig" "staging/$ASSET.sig"
          DEB="$(find "$BUNDLE_DIR/deb" -maxdepth 1 -name '*.deb' | head -1)"
          cp "$DEB" "staging/Arxa-Studio-${VERSION}-${TARGET_TRIPLE}.deb"
          # install.sh verifies <asset>.sha256 next to every Linux asset
          (cd staging && for f in *.AppImage *.deb; do sha256sum "$f" > "$f.sha256"; done)
          URL="https://github.com/${RELEASES_REPO}/releases/download/${GITHUB_REF_NAME}/${ASSET}"
          node arxa/desktop/scripts/make-update-manifest.mjs \
            --bundle "staging/$ASSET" --sig "staging/$ASSET.sig" \
            --version "$VERSION" --channel "$CHANNEL" \
            --target "$TAURI_TARGET" --arch "$TAURI_ARCH" \
            --url "$URL" --out staging/latest.json
          node arxa/desktop/scripts/make-update-manifest.mjs --check staging/latest.json

      - name: Upload Linux assets to the GitHub Release (created by the macOS job)
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASES_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$RELEASES_REPO" --clobber \
            staging/"$ASSET" staging/"$ASSET".sig staging/*.deb staging/*.sha256

      - name: Push latest.json to arxa-releases main
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASES_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${RELEASES_REPO}.git" releases
          MANIFEST_DIR="releases/desktop/${CHANNEL}/${TAURI_TARGET}/${TAURI_ARCH}"
          mkdir -p "$MANIFEST_DIR"
          cp staging/latest.json "$MANIFEST_DIR/latest.json"
          # the curl | sh installer, served from the repo root
          cp arxa/desktop/scripts/install.sh releases/install.sh
          cd releases
          git config user.name "arxa-release-bot"
          git config user.email "noreply@arxadigital.solutions"
          git add "desktop/${CHANNEL}/${TAURI_TARGET}/${TAURI_ARCH}/latest.json" install.sh
          git commit -m "chore: publish ${CHANNEL} ${TAURI_TARGET}/${TAURI_ARCH} manifest for ${VERSION}"
          # the macOS job pushed its manifest moments ago: rebase, never force
          git pull --rebase origin main
          git push origin HEAD:main

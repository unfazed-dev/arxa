name: appbox_kit_payments
description: Native-first payments for appbox_kit apps — Apple Pay + Google Pay via Google's first-party pay plugin, behind a pluggable provider port so Stripe/PayPal backends slot in later. Typed PaymentResult, scriptable fakes.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Google-maintained wrapper over PassKit (Apple Pay) and the Google Pay API.
  # The native-first choice; ships the ApplePayButton/GooglePayButton widgets
  # this package re-exports behind KitPayButton. Android + iOS only.
  pay: ^3.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# No assets declared here — payment profile JSON lives under example/ and is
# meant to be copied into the host app's own assets/ (or fetched at runtime).

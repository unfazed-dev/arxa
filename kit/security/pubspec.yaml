name: arxa_kit_security
description: Plugin-neutral security capability kit — typed biometric auth, secure storage, AES-GCM crypto, a pure-Dart app-lock state machine, and a device-integrity port. Standalone; depends on no other kit.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Native-first biometric auth: wraps LocalAuthentication (iOS) /
  # BiometricPrompt (Android). Its exceptions/error codes are mapped to the
  # typed ArxaKitBiometricFailureReason so the plugin never leaks past the port.
  # Latest verified on pub.dev 2026-07-14: 3.0.2 (publisher flutter.dev).
  local_auth: ^3.0.2
  # Encrypted key-value storage backing ArxaKitSecureStorageService (iOS Keychain /
  # Android EncryptedSharedPreferences+Keystore). Latest verified on pub.dev
  # 2026-07-14: 10.3.1.
  flutter_secure_storage: ^10.3.1
  # Pure-Dart AES-GCM / SHA-256 / HMAC backend for ArxaKitCryptoService (uses the
  # package's DartCryptography fallback in tests — no platform channels).
  # Latest verified on pub.dev 2026-07-14: 2.9.0.
  cryptography: ^2.9.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

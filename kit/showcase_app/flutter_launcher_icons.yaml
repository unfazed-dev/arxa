# Launcher-icon law (ratified 2026-08-09): every app owns its brand master in
# assets/brand-icons/ (mirrors assets.manifest.json brandIcon). Launcher and
# splash both derive from that single master. Derived platform icons are
# committed — regenerate after emit:  dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/brand-icons/arxa-icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/brand-icons/arxa-icon.png"
  # Theme-adaptive: Android 13+ tints the monochrome layer (alpha-only glyph)

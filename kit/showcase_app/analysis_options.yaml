include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Build output — vendored plugin sources (e.g. build/ios/SourcePackages/
    # firebase_messaging-*/test) are third-party code, never hand-written;
    # without this a full-project `flutter analyze` fails on THEIR tests.
    - build/**
    # Generated by stacked_generator (build_runner) — regenerated, never
    # hand-edited. It imports stacked/stacked_services, which are now
    # transitive (via the arxa_kit_ui_library barrel), tripping
    # depend_on_referenced_packages with no hand-written recourse.
    # (app.locator.dart needs no exclude — its generated header already
    # carries ignore_for_file: depend_on_referenced_packages.)
    - lib/app/app.router.dart

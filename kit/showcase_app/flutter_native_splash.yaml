# GENERATED by branding/tools/generate_branding.sh — do not edit by hand.
# flutter_native_splash config. Three things to know:
#  1. Background = the kit theme's scaffoldBackgroundColor — AppBoxKitColors.surface
#     (#F5F0E8) light / AppBoxKitDarkColors.bone (#1C1814) dark — so the native OS
#     splash matches the in-Flutter startup view (colorScheme.surface) with no
#     color seam, and follows the system theme via color_dark. NOT the brand
#     accent. Mirrors the kit color ramp; update both if the ramp changes.
#  2. Logo size — flutter_native_splash renders `image:` at its SOURCE pixel
#     dimensions (no upscale). `image:` is a dedicated <base>-splash.png
#     rasterized at 4× the 80dp startup logo (320px) by generate_branding.sh.
#     Android 12+ renders `image:` inside a fixed ~240dp icon window, so the
#     ON-SCREEN size is the logo's fraction of a 960px canvas — generate_
#     branding.sh pads a 334px logo into a transparent 960 canvas
#     (<base>-splash-android12.png); icon_background_color(_dark) supplies the
#     theme-reactive backdrop behind the transparent canvas.
#  3. All splash derivatives live beside the master in assets/brand-icons/.
# Generate after emit:  dart run flutter_native_splash:create
#
# Handoff: native splash (instant) -> preserved past first frame ->
# FlutterNativeSplash.remove() once the in-Flutter startup view renders its
# brand moment (see host main.dart + startup viewmodel).
flutter_native_splash:
  color: "#F5F0E8"
  color_dark: "#1C1814"
  image: "assets/brand-icons/appbox-icon-splash.png"
  android_12:
    image: "assets/brand-icons/appbox-icon-splash-android12.png"
    icon_background_color: "#F5F0E8"
    icon_background_color_dark: "#1C1814"

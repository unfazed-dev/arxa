name: appbox_kit_maps
description: Maps port for appbox_kit apps — a plugin-neutral KitMapView that
  resolves to a native map provider per platform (Google Maps on Android/web,
  Apple Maps on iOS), behind Kit-owned value types so no app code ever imports
  a map SDK directly.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.0.3 <4.0.0'

# NATIVE-FIRST / STANDALONE: this package intentionally depends on neither
# appbox_kit (core), stacked, nor stacked_services. It is a pure port with
# four wired providers: google_maps_flutter and apple_maps_flutter (each
# platform's first-party SDK), plus flutter_map for OpenStreetMap and Mapbox.
# flutter_map is pure Dart (no native SDK, no secret download token), so the
# OSM and Mapbox backends run on simulators, emulators, and widget tests.
# Mapbox is served as 512px raster tiles through flutter_map with a public
# pk.* token — the native mapbox_maps_flutter SDK (which needs a secret sk.*
# token in ~/.netrc) is deliberately NOT used.
dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.18.0
  apple_maps_flutter: ^1.4.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

name: appbox_kit_auth
description: API-first auth seam for appbox_kit apps — a KitAuthService port (email/password + OAuth), typed AuthResult with failure reasons, an in-memory default backend, and scriptable fakes. Seed-backend and native OAuth wiring are later phases.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  # No UI here today, but the OAuth provider stubs will wire the Flutter
  # plugins google_sign_in / sign_in_with_apple in a later phase — declaring
  # the Flutter SDK now keeps that a non-breaking add.
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

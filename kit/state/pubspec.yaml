name: arxa_kit_state
description: Pure-Dart async state vocabulary for arxa_kit apps — a sealed ArxaKitState (idle/pending/loading/success/error) with when/map combinators, a ArxaKitStateNotifier (current value + broadcast stream) with a guarded track helper, and a legal-transition matrix. Zero Flutter dependency.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  # Pure Dart — no Flutter. `meta` supplies @immutable/@protected only.
  meta: ^1.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.24.0

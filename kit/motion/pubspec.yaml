name: appbox_kit_motion
description: Route-driven wake-up & set-down choreography for Stacked apps — KitMotionScope + KitWake stagger children off any Animation<double> (route push/pop, tab slide, manual controller), with a flutter_animate adapter for arbitrary effects. Standalone capability kit; no dependency on appbox_kit core.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # KitMotionAdapter bridges scope slices into Animate timelines so any
  # flutter_animate effect can ride the route/tab driver.
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

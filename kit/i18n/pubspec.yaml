name: appbox_kit_i18n
description: Locale machinery for appbox_kit apps — a KitLanguage value type, a persisted system+override locale model (KitI18n extends ChangeNotifier for live switching), intl-backed date/number/currency formatting, placeholder-parity checking, and an LLM locale directive for generative UI. Standalone capability kit; no dependency on appbox_kit core. Translation strings are deliberately NOT codegen'd here — apps own their gen-l10n output.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # GlobalMaterialLocalizations / GlobalWidgetsLocalizations / GlobalCupertinoLocalizations
  # delegates for MaterialApp.
  flutter_localizations:
    sdk: flutter
  # Date/number/currency formatting; version SDK-pinned via flutter_localizations — never pin.
  intl: any
  # Locale override persistence.
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
